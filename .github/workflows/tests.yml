name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Application CI Checks
    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: halalspot_testing_clean
          POSTGRES_USER: halalspot_testing_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U halalspot_testing_user -d halalspot_testing_clean"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: halalspot_testing_clean
      DB_USERNAME: halalspot_testing_user
      DB_PASSWORD: ci_test_password
      DB_URL: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: pgsql, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form

      - name: Check frontend
        run: |
          npm run check
          npm run types:check

      - name: Check PHP formatting and types
        run: |
          composer lint:check
          composer types:check

      - name: Build frontend assets
        run: npm run build

      - name: Run PostgreSQL tests
        run: composer test:pgsql
